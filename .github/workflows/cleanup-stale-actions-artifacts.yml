name: Cleanup stale Actions artifacts

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.event.head_commit.message == 'ci: cleanup stale release artifacts'
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/$REPOSITORY/actions/artifacts/8456929270"
          gh api --method DELETE "/repos/$REPOSITORY/actions/artifacts/8456879349"
